<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="/static/login.css">
</head>
<body>
  <main class="card">
    <h1>Login</h1>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username"
               placeholder="name@example.com" required aria-describedby="email-error">
        <p id="email-error" class="field-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-row">
          <input id="password" name="password" type="password" autocomplete="current-password"
                 required aria-describedby="password-hint password-error">
          <button id="toggle-password" type="button" aria-controls="password"
                  aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <p id="password-hint" class="hint">At least 3 words separated by spaces.</p>
        <p id="password-error" class="field-error" aria-live="polite"></p>
      </div>

      <div id="form-message" class="form-message" role="alert"></div>

      <button id="login-button" type="submit">Login</button>
    </form>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
